<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content : dit au navigateur de vraiment
         rétrécir le viewport visible quand le clavier iOS s'ouvre, plutôt
         que de le laisser flotter par-dessus le contenu sans le redimensionner
         (comportement par défaut sur certaines versions récentes de Safari/
         Chrome) — sans ça, un champ de saisie en bas d'un écran plein écran
         (position: fixed) peut se retrouver caché sous le clavier. Ignoré
         silencieusement par les navigateurs qui ne le reconnaissent pas
         encore, donc sans risque. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>PISTE</title>

    <!-- Icône affichée sur l'écran d'accueil iOS après "Partager > Sur
         l'écran d'accueil" — sans ce lien, iOS retombe sur une case grise
         (ou une capture de la page) au lieu du logo PISTE. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Couleur de fond réelle de l'app (mode sombre, toujours actif par
         défaut — voir ThemeProvider), pas l'accent orange du thème clair :
         c'est cette couleur que la barre d'adresse Safari/Chrome teinte,
         donc elle doit correspondre à ce qui s'affiche vraiment, pas à un
         thème que l'app ne montre jamais au premier lancement. -->
    <meta name="theme-color" content="#0D0F08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Version standard (non préfixée) du même réglage — iOS ne lit que la
         version "apple-", mais l'inclure prépare le terrain pour les
         navigateurs qui la reconnaissent déjà (Chrome/Edge Android). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black-translucent" est le seul réglage qui laisse vraiment le contenu
         s'étendre sous la barre de statut/l'encoche en PWA plein écran — avec
         "default", iOS réserve une bande opaque en haut et l'app n'utilise
         jamais tout l'écran. Le contenu réel (en-têtes, boutons) se protège
         de la barre de statut via env(safe-area-inset-top) côté CSS. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PISTE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
